<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ツーリング時間計算</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
body { font-family:sans-serif; padding:10px; max-width:600px; margin:auto; }
button { padding:10px; margin:5px 0; width:100%; font-size:16px; }
input { width:100%; padding:8px; margin:5px 0; }
.time { color:blue; font-weight:bold; }
.final { color:red; font-size:22px; }
</style>

</head>

<body>

<h2>ツーリング時間計算</h2>

出発時間 <input type="time" id="startTime" value="07:00">

<button onclick="addRow()">＋ルート追加</button> <button onclick="shareURL()">🔗 URL共有</button> <button onclick="showQR()">📷 QR表示</button>

<div id="app"></div>
<h3 id="final"></h3>
<div id="qrBox"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
let routes=[];

/* ===== データ取得（重要：ここで常に最新を作る） */
function getData(){
  return {
    startTime: document.getElementById("startTime").value,
    routes: routes
  };
}

/* ===== URL生成（共通化） */
function createURL(){
  const data = getData();

  // 空チェック（ここ追加）
  if(!data.routes.length){
    alert("ルートを1つ以上入力しろ");
    return null;
  }

  const encoded = encodeURIComponent(JSON.stringify(data));
  const url = location.origin + location.pathname + "?data=" + encoded;

  console.log("生成URL:", url); // ←デバッグ用

  return url;
}

/* ===== URL共有 ===== */
function shareURL(){
  const url = createURL();
  if(!url) return;

  if(navigator.share){
    navigator.share({ url });
  }else{
    prompt("コピーして使え", url);
  }
}

/* ===== QR ===== */
function showQR(){
  const url = createURL();
  if(!url) return;

  const box = document.getElementById("qrBox");
  box.innerHTML = "";

  QRCode.toCanvas(url, { width:200 }, (err, canvas)=>{
    if(err) return console.error(err);
    box.appendChild(canvas);
  });
}

/* ===== URLから復元 ===== */
function loadFromURL(){
  const params = new URLSearchParams(location.search);
  const data = params.get("data");

  if(data){
    try{
      const decoded = JSON.parse(decodeURIComponent(data));
      document.getElementById("startTime").value = decoded.startTime;
      routes = decoded.routes;
    }catch(e){
      console.error("URL読み込み失敗");
    }
  }
}

/* ===== 行追加 ===== */
function addRow(){
  routes.push({from:"",to:"",distance:0,speed:0,break:0});
  render();
}

/* ===== 更新 ===== */
function update(i,k,v){
  routes[i][k]=(k==="from"||k==="to")?v:Number(v);
  calculate();
}

/* ===== 描画 ===== */
function render(){
  const app=document.getElementById("app");
  app.innerHTML = routes.map((r,i)=>`
    <div>
      ${i+1}
      出発:${i===0?`<input value="${r.from}" onchange="update(${i},'from',this.value)">`:`${routes[i-1]?.to||""}`}
      到着:<input value="${r.to}" onchange="update(${i},'to',this.value)">
      距離:<input type="number" value="${r.distance}" onchange="update(${i},'distance',this.value)">
      速度:<input type="number" value="${r.speed}" onchange="update(${i},'speed',this.value)">
      休憩:<input type="number" value="${r.break}" onchange="update(${i},'break',this.value)">
      出発:<span id="start_${i}" class="time"></span>
      到着:<span id="arrival_${i}" class="time"></span>
    </div>
  `).join("");

  calculate();
}

/* ===== 計算 ===== */
function calculate(){
  let [h,m]=startTime.value.split(":").map(Number);
  let cur=h*60+m;
  let final="";

  routes.forEach((r,i)=>{
    if(!r.speed||!r.distance) return;

    let start=cur;
    let arr=start+(r.distance/r.speed)*60;

    let sh=Math.floor(start/60)%24;
    let sm=Math.floor(start%60);
    let ah=Math.floor(arr/60)%24;
    let am=Math.floor(arr%60);

    document.getElementById("start_"+i).textContent=`${pad(sh)}:${pad(sm)}`;
    document.getElementById("arrival_"+i).textContent=`${pad(ah)}:${pad(am)}`;

    cur=arr+r.break;
    final=`${pad(ah)}:${pad(am)}`;
  });

  finalEl.innerHTML = final ? `最終到着: <span class="final">${final}</span>` : "";
}

function pad(n){ return n.toString().padStart(2,"0"); }

/* 初期化 */
loadFromURL();
addRow();
render();
</script>

</body>
</html>
