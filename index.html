<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ツーリング時間計算</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
body{font-family:sans-serif;padding:10px;max-width:700px;margin:auto;background:#fff;color:#000;}
body.dark{background:#111;color:#eee;}
button{padding:12px;margin:5px 0;width:100%;font-size:16px;border-radius:6px;border:none;}
.btn-save{background:#4CAF50;color:#fff;}
.btn-load{background:#2196F3;color:#fff;}
.btn-del{background:#f44336;color:#fff;}
.btn-add{background:#FF9800;color:#fff;}
.btn-sub{background:#555;color:#fff;}
input,select{width:100%;padding:8px;margin:5px 0;}
.time{color:#2196F3;font-weight:bold;}
.final{color:#f44336;font-size:22px;font-weight:bold;}
.row{border-bottom:1px solid #ccc;padding:10px 0;}
</style>

</head>

<body>

<h2>ツーリング計算</h2>

<button onclick="toggleDark()" class="btn-sub">🌙ダーク</button> <button onclick="shareURL()">🔗URL共有</button> <button onclick="showQR()">📷QR</button>

出発時間<input type="time" id="startTime" value="07:00">

保存名<input id="saveName"> <button class="btn-save" onclick="saveData()">保存</button> <select id="saveList"></select> <button class="btn-load" onclick="loadData()">読込</button> <button class="btn-del" onclick="deleteData()">削除</button>

<button onclick="exportData()">書き出し</button> <input type="file" onchange="importData(event)">

<div id="app"></div>
<button class="btn-add" onclick="addRow()">＋追加</button>

<h3 id="final"></h3>
<div id="qrBox"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
let routes=[];

/* ダーク */
if(localStorage.getItem("dark")==="on")document.body.classList.add("dark");
function toggleDark(){
 document.body.classList.toggle("dark");
 localStorage.setItem("dark",document.body.classList.contains("dark")?"on":"off");
}

/* 保存 */
function getAll(){return JSON.parse(localStorage.getItem("data")||"{}");}
function updateList(){
 saveList.innerHTML="";
 Object.keys(getAll()).forEach(n=>saveList.innerHTML+=`<option>${n}</option>`);
}
function saveData(){
 let n=saveName.value;if(!n)return;
 let d=getAll();
 d[n]={startTime:startTime.value,routes};
 localStorage.setItem("data",JSON.stringify(d));
 updateList();
}
function loadData(){
 let d=getAll()[saveList.value];if(!d)return;
 startTime.value=d.startTime;
 routes=d.routes;
 render();
}
function deleteData(){
 let d=getAll();delete d[saveList.value];
 localStorage.setItem("data",JSON.stringify(d));
 updateList();
}

/* JSON */
function exportData(){
 const blob=new Blob([JSON.stringify({startTime:startTime.value,routes})]);
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="touring.json";
 a.click();
}
function importData(e){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  let d=JSON.parse(r.result);
  startTime.value=d.startTime;
  routes=d.routes;
  render();
 };
 r.readAsText(f);
}

/* URL生成（重要修正版） */
function createURL(){
 if(!routes.length){
  alert("ルート入れろ");
  return null;
 }
 const encoded=encodeURIComponent(JSON.stringify({
  startTime:startTime.value,
  routes:routes
 }));
 return location.origin+location.pathname+"?data="+encoded;
}

/* URL共有 */
function shareURL(){
 const url=createURL(); if(!url)return;
 if(navigator.share){navigator.share({url});}
 else prompt("コピー",url);
}

/* QR */
function showQR(){
 const url=createURL(); if(!url)return;
 qrBox.innerHTML="";
 QRCode.toCanvas(url,{width:200},(e,c)=>qrBox.appendChild(c));
}

/* URL読込 */
function loadFromURL(){
 const p=new URLSearchParams(location.search);
 if(p.get("data")){
  let d=JSON.parse(decodeURIComponent(p.get("data")));
  startTime.value=d.startTime;
  routes=d.routes;
 }
}

/* 行 */
function addRow(){routes.push({from:"",to:"",distance:0,speed:0,break:0});render();}
function update(i,k,v){routes[i][k]=(k==="from"||k==="to")?v:Number(v);calc();}

/* 描画 */
function render(){
 app.innerHTML=routes.map((r,i)=>`
 <div class="row">
 ${i+1}
 出発:${i===0?`<input value="${r.from}" onchange="update(${i},'from',this.value)">`:`${routes[i-1]?.to||""}`}
 到着:<input value="${r.to}" onchange="update(${i},'to',this.value)">
 距離:<input type="number" value="${r.distance}" onchange="update(${i},'distance',this.value)">
 速度:<input type="number" value="${r.speed}" onchange="update(${i},'speed',this.value)">
 休憩:<input type="number" value="${r.break}" onchange="update(${i},'break',this.value)">
 出発:<span id="s${i}" class="time"></span>
 到着:<span id="a${i}" class="time"></span>
 </div>`).join("");
 calc();
}

/* 計算 */
function calc(){
 let [h,m]=startTime.value.split(":").map(Number);
 let cur=h*60+m,final="";
 routes.forEach((r,i)=>{
  if(!r.speed||!r.distance)return;
  let st=cur,ar=st+(r.distance/r.speed)*60;
  let sh=Math.floor(st/60)%24,sm=Math.floor(st%60);
  let ah=Math.floor(ar/60)%24,am=Math.floor(ar%60);
  s${''}+i; // dummy
  document.getElementById("s"+i).textContent=`${pad(sh)}:${pad(sm)}`;
  document.getElementById("a"+i).textContent=`${pad(ah)}:${pad(am)}`;
  cur=ar+r.break;
  final=`${pad(ah)}:${pad(am)}`;
 });
 finalEl.innerHTML=final?`最終到着:<span class="final">${final}</span>`:"";
}
function pad(n){return n.toString().padStart(2,"0");}

/* 初期 */
loadFromURL();
updateList();
addRow();
render();
</script>

</body>
</html>
